# MarlonTheBug default configuration
# This file is bundled with the application. User overrides live in the
# application config directory (config.yaml) and are merged on top.

general:
  threads: 20
  timeout: 10
  retries: 2
  backoff: 1.5
  verify_ssl: true
  follow_redirects: true
  max_redirects: 5
  user_agent: "MarlonTheBug/2.0 (authorized security assessment)"

scope:
  require_confirmation: true
  allow_exploitation: false
  allowed_domains: []
  allowed_ip_ranges: []
  excluded: []

http:
  proxy:
    enabled: false
    http: null
    https: null
    socks: null
  headers:
    Accept-Language: "es-ES,es;q=0.9,en;q=0.8"
  tls:
    verify: true
    ca_bundle: null

crawler:
  max_depth: 3
  max_pages: 200
  respect_robots_txt: true
  follow_subdomains: false
  extract_js: true
  extract_api_endpoints: true

scan:
  requests_per_second: 8
  max_requests: 2500
  verify_findings: true
  deduplicate: true
  default_profile: standard

exploitation:
  confirm_before_payload: true
  confirm_before_listener: true
  max_concurrent_sessions: 5
  auto_cleanup: true
  log_all_actions: true
  default_listener_port: 4444
  backend: "docker"
  docker_image: "ghcr.io/shakethec0de/marlonthebug-exploit:latest"
  runner_url: "http://exploit-runner:8090"
  runner_token: ""
  timeout: 150
  network: "bridge"
  memory: "512m"
  cpus: 1.0
  pids_limit: 128
  run_as_user: "10002:10002"
  rewrite_localhost: true
  max_export_bytes: 512000

panel:
  host: "127.0.0.1"
  port: 8765
  open_browser: true
  auth: true
  page_size: 50

intel:
  auto_sync: true
  sync_interval_hours: 24
  offline: false
  request_timeout: 30
  cpe_timeout: 12
  nvd_api_key: ""
  max_cpe_lookups: 5
  signing_public_key: ""
  require_bundle_signature: false
  kev_url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
  epss_url: "https://api.first.org/data/v1/epss"
  osv_url: "https://api.osv.dev/v1"
  nvd_url: "https://services.nvd.nist.gov/rest/json/cves/2.0"

reports:
  language: "es"
  template: "full"
  classification: "CONFIDENCIAL"
  company: "MarlonTheBug"
  include_evidence: true
  include_remediation: true
  include_waf_rules: true

tools:
  enabled: true
  backend: "docker"
  docker_image: "marlonthebug/kali-tools:latest"
  remote_url: "http://tools-runner:8080"
  remote_token: ""
  timeout: 180
  network: "bridge"
  max_output_chars: 60000
  auto_pull: false
  rewrite_localhost: true

logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level: <8} | {name}:{function}:{line} | {message}"
  rotation: "10 MB"
  retention: "30 days"
  file: null
  console: true
