# MarlonTheBug Default Configuration
# ====================================

general:
  threads: 50
  timeout: 10
  retries: 3
  backoff: 2.0
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
  verify_ssl: true
  follow_redirects: true
  max_redirects: 5

scope:
  require_confirmation: true
  allow_exploitation: false
  allowed_domains: []
  allowed_ip_ranges: []
  excluded: []

http:
  proxy:
    enabled: false
    http: null
    https: null
    socks: null
  headers:
    Accept-Language: "en-US,en;q=0.9"
    Accept-Encoding: "gzip, deflate"
  tls:
    ciphers: null
    min_version: null

exploitation:
  confirm_before_payload: true
  confirm_before_listener: true
  max_concurrent_sessions: 5
  auto_cleanup: true
  log_all_actions: true
  default_listener_port: 4444

collaborator:
  enabled: true
  http_host: "0.0.0.0"
  http_port: 8080
  dns_host: "0.0.0.0"
  dns_port: 5353
  polling_interval: 2
  token_length: 16

crawler:
  max_depth: 5
  max_pages: 1000
  respect_robots_txt: true
  follow_subdomains: false
  extract_js: true
  extract_api_endpoints: true

fuzzer:
  threads: 30
  delay: 0
  rate_limit: 0
  match_codes: [200, 201, 301, 302, 307, 403, 500]
  filter_codes: [404]
  match_length_threshold: 100
  recursion_depth: 2

recon:
  subdomain_enum:
    wordlist: "default"
    sources: ["crtsh", "dns_brute"]
    threads: 50
  dns_bruteforce:
    wordlist: "small"
    record_types: ["A", "AAAA", "CNAME"]
  tech_fingerprint:
    deep_scan: false
  endpoint_discovery:
    wordlist: "medium"
    extensions: ["php", "asp", "aspx", "jsp", "html", "js", "json", "xml", "txt", "bak", "old", "swp"]
  js_analyzer:
    extract_endpoints: true
    extract_secrets: true
    parse_sourcemaps: true
  secret_finder:
    min_entropy: 4.0
    max_file_size_mb: 10
  git_leaks:
    check_dot_git: true
    check_commits: false

database:
  url: "sqlite+aiosqlite:///data/marlonthebug.db"
  echo: false
  pool_size: 10

logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level: <8} | {name}:{function}:{line} | {message}"
  rotation: "10 MB"
  retention: "30 days"
  file: "logs/marlonthebug.log"
  console: true

output:
  formats: ["json", "markdown"]
  template: "technical"
  include_evidence: true
  include_remediation: true
  include_waf_rules: true
  output_dir: "reports"
