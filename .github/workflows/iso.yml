name: Kali Live ISO (legacy)

# The primary images are now built by .github/workflows/arch-iso.yml.
# This workflow is kept as a manual fallback while the Arch profiles mature.
on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Arquitectura del ISO"
        required: true
        default: amd64
        type: choice
        options: [amd64, arm64]

permissions:
  contents: read

concurrency:
  group: kali-live-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  iso:
    name: Build Kali legacy Live
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Show free space before build
        run: df -h
      - name: Build ISO
        env:
          ARCH: ${{ github.event.inputs.arch || 'amd64' }}
          USE_CONTAINER: "1"
          CONTAINER: docker
        run: |
          chmod +x distro/build.sh
          ./distro/build.sh
      - name: Show output
        run: ls -lh distro/output || true
      - uses: actions/upload-artifact@v4
        with:
          name: marlonthebug-kali-legacy-${{ github.event.inputs.arch || 'amd64' }}
          path: distro/output/*.iso
          if-no-files-found: error
          retention-days: 7
