name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    name: Binary · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: marlonthebug-linux-x86_64
          - os: macos-14
            artifact: marlonthebug-macos-arm64
          - os: macos-13
            artifact: marlonthebug-macos-x86_64
          - os: windows-latest
            artifact: marlonthebug-windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv pip install pyinstaller
      - name: Build binary
        run: >
          uv run pyinstaller
          --noconfirm
          --clean
          --onedir
          --name marlonthebug
          --collect-all marlonthebug
          --hidden-import aiosqlite
          --hidden-import sqlalchemy.dialects.sqlite.aiosqlite
          --hidden-import uvicorn.logging
          --hidden-import uvicorn.loops.auto
          --hidden-import uvicorn.protocols.http.auto
          --hidden-import uvicorn.protocols.websockets.auto
          --hidden-import uvicorn.lifespan.on
          scripts/entrypoint.py
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar -czf "${{ matrix.artifact }}.tar.gz" marlonthebug
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          Compress-Archive -Path marlonthebug -DestinationPath "${{ matrix.artifact }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.zip

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            artifacts/*
          generate_release_notes: true
