[main]
# Never let NetworkManager rewrite /etc/resolv.conf. The static file points
# at public resolvers, but nftables permits UDP/TCP 53 only for the Tor user.
dns=none
rc-manager=unmanaged

[device]
# Randomize Wi-Fi probe/scan MAC addresses.
wifi.scan-rand-mac-address=yes

[connectivity]
# Direct HTTP connectivity checks are blocked by the firewall; do not let
# NetworkManager interpret that as a broken connection.
enabled=false

[connection]
# Random MAC per network, stable across reconnects within this boot. The boot
# script also randomizes physical interfaces before NetworkManager starts.
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=stable
