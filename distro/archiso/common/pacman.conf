#
# pacman.conf for the MarlonTheBug archiso profiles.
# Based on the official archiso releng configuration.
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
VerbosePkgLists
ParallelDownloads = 5
# The build runs inside containers/CI; pacman 7's seccomp sandbox is not
# available under every emulation/container setup. The build host is trusted.
DisableSandbox
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Optional: enable BlackArch or another repository for extra tools.
# Keep it disabled by default so the base images only use official,
# signed Arch Linux packages.
#[blackarch]
#Server = https://mirror.example.org/blackarch/$repo/os/$arch
