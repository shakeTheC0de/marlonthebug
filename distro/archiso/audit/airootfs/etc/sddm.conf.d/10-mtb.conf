[General]
Numlock=on
# The live ISO must work on machines where the Wayland greeter or the
# hardware GL stack fails. X11 + software Qt is slower but reliable.
DisplayServer=x11
GreeterEnvironment=QT_QUICK_BACKEND=software LIBGL_ALWAYS_SOFTWARE=1

[Theme]
Current=breeze

[Users]
MaximumUid=60000
DefaultSession=xfce
