# MarlonTheBug Audit — syslinux (BIOS) boot menu.
DEFAULT arch
PROMPT 0
TIMEOUT 50
UI vesamenu.c32
MENU TITLE MarlonTheBug Audit
MENU BACKGROUND splash.png

MENU WIDTH 78
MENU MARGIN 4
MENU ROWS 7
MENU VSHIFT 10
MENU TABMSGROW 14
MENU CMDLINEROW 14
MENU HELPMSGROW 16
MENU HELPMSGENDROW 29

MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #9033ccff #a0000000 std
MENU COLOR sel          7;37;40 #e0ffffff #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std
MENU COLOR timeout_msg  37;40   #80ffffff #00000000 std
MENU COLOR timeout      1;37;40 #c0ffffff #00000000 std
MENU COLOR msg07        37;40   #90ffffff #a0000000 std
MENU COLOR tabmsg       31;40   #30ffffff #00000000 std

MENU CLEAR
MENU IMMEDIATE

LABEL arch
TEXT HELP
Arranca MarlonTheBug Audit.
RED DIRECTA: no hay anonimato. Solo sistemas propios o autorizados.
ENDTEXT
MENU LABEL MarlonTheBug Audit (BIOS, red directa)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G %KERNEL_PARAMS%

LABEL safe
TEXT HELP
Modo de compatibilidad para GPUs o equipos que no arrancan en modo normal.
Usa nomodeset.
ENDTEXT
MENU LABEL MarlonTheBug Audit (modo seguro)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G nomodeset %KERNEL_PARAMS%

LABEL existing
TEXT HELP
Arranca el sistema operativo instalado en el disco interno.
ENDTEXT
MENU LABEL Arrancar el sistema existente
COM32 chain.c32
APPEND hd0 0

LABEL reboot
MENU LABEL Reiniciar
COM32 reboot.c32

LABEL poweroff
MENU LABEL Apagar
COM32 poweroff.c32
