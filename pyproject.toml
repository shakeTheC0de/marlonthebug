[project]
name = "marlonthebug"
version = "2.0.0"
description = "MarlonTheBug — Offensive Security Auditing & Reporting Platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "MarlonTheBug Team" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "aiodns>=3.2.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "anyio>=4.6.0",
    "beautifulsoup4>=4.12.0",
    "blinker>=1.9.0",
    "cryptography>=43.0.0",
    "cvss>=3.4",
    "dnspython>=2.7.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
    "loguru>=0.7.0",
    "lxml>=5.3.0",
    "markdown>=3.7.0",
    "parsel>=1.9.0",
    "platformdirs>=4.3.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dateutil>=2.9.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.0",
    "rich>=13.9.0",
    "sqlalchemy[aiosqlite]>=2.0.35",
    "tldextract>=5.1.0",
    "typer>=0.15.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
pdf = [
    "playwright>=1.48.0",
    "weasyprint>=62.0",
]
tui = [
    "textual>=0.80.0",
]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-httpx>=0.33.0",
    "ruff>=0.7.0",
    "types-python-dateutil>=2.9.0",
    "types-pyyaml>=6.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-httpx>=0.33.0",
    "ruff>=0.7.0",
    "types-python-dateutil>=2.9.0",
    "types-pyyaml>=6.0.0",
]

[project.scripts]
marlonthebug = "marlonthebug.main:app"

[project.urls]
Repository = "https://github.com/shakeTheC0de/marlonthebug"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["marlonthebug"]

[tool.hatch.build.targets.sdist]
include = [
    "/marlonthebug",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["marlonthebug/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "C4", "SIM", "UP", "RUF", "T20", "PLE", "PLW"]
ignore = ["T201", "PLR0913", "PLR0912", "PLR0911", "PLR0915", "B008", "RUF012", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["marlonthebug"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]
"marlonthebug/db/migrations/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_unreachable = true
warn_unused_ignores = false
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "textual.*",
    "playwright.*",
    "weasyprint.*",
    "aiodns.*",
    "cvss.*",
]
ignore_missing_imports = true

# Legacy modules with heavy BeautifulSoup/asyncio dynamic typing. Their runtime
# behaviour is covered by integration tests; keep mypy focused on the new core.
[[tool.mypy.overrides]]
module = [
    "marlonthebug.crawler.*",
    "marlonthebug.cli.console",
    "marlonthebug.collaborator.*",
    "marlonthebug.plugins.recon.*",
    "marlonthebug.plugins.web.*",
    "marlonthebug.exploit.webapp.*",
    "marlonthebug.utils.ssl_tls",
    "marlonthebug.web.routes",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
