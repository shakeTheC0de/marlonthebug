[project]
name = "marlonthebug"
version = "1.0.0"
description = "Offensive Security Auditing & Exploitation Platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "MarlonTheBug Team" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "httpx>=0.28.0",
    "aiohttp>=3.10.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "textual>=0.80.0",
    "sqlalchemy[aiosqlite]>=2.0.35",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
    "dnspython>=2.7.0",
    "loguru>=0.7.0",
    "cryptography>=43.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "tldextract>=5.1.0",
    "python-dateutil>=2.9.0",
    "playwright>=1.48.0",
    "weasyprint>=62.0",
    "anyio>=4.6.0",
    "aiodns>=3.2.0",
    "blinker>=1.9.0",
    "parsel>=1.9.0",
    "markdown>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.33.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.0",
    "types-python-dateutil>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.33.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.0",
    "types-python-dateutil>=2.9.0",
]

[project.scripts]
marlonthebug = "marlonthebug.main:app"

[project.urls]
Repository = "https://github.com/marlonthebug/marlonthebug"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "B", "C4", "SIM",
    "UP", "RUF", "T20", "PLE", "PLW", "PLR"
]
ignore = ["T201", "PLR0913", "PLR0912", "PLR0911"]

[tool.ruff.lint.isort]
known-first-party = ["marlonthebug"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "textual.*",
    "playwright.*",
    "weasyprint.*",
    "aiodns.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=marlonthebug --cov-report=term-missing"
